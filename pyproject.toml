[project]
name = "crypto-rank-tracker"
version = "0.7.1"
description = "Durable Upbit KRW market attention tracking with point-in-time replay."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiohttp>=3.12.13,<4.0.0",
  "google-cloud-storage>=3.1.1,<4.0.0",
  "aiofiles>=24.1.0,<25.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "numpy>=2.0,<2.3",
  "tqdm>=4.67.1,<5.0.0",
  "functions-framework>=3.9.2,<4.0.0",
  "aiolimiter>=1.2.1,<2.0.0",
]

[project.scripts]
crypto-rank-replay = "replay_upbit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
artifacts = ["main.py", "config.py", "update_sectors.py", "replay_upbit.py"]
include = ["common/**", "main.py", "config.py", "update_sectors.py", "replay_upbit.py"]
force-include = {"main.py" = "main.py", "config.py" = "config.py", "update_sectors.py" = "update_sectors.py", "replay_upbit.py" = "replay_upbit.py"}

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.21,<0.16.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "ARG",
  "B",
  "C90",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "F",
  "G",
  "I",
  "LOG",
  "N",
  "PERF",
  "RET",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = ["main.py", "config.py", "update_sectors.py", "replay_upbit.py", "common/**", "tests/**"]
